<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${restaurant.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">

  <div class="flash err" th:unless="${restaurant.approved}"
       th:text="'이 맛집은 현재 [' + ${restaurant.status.label} + '] 상태라 작성자와 관리자에게만 보입니다.'"></div>

  <div class="detail-head">
    <div>
      <h1 style="margin-bottom:6px" th:text="${restaurant.name}">가게 이름</h1>
      <span class="badge" th:text="${restaurant.category.label}">분류</span>
      <span class="badge" th:text="${restaurant.district.label}">구</span>
      <span class="rating" style="margin-left:8px">★
        <span th:text="${restaurant.reviewCount > 0} ? ${#numbers.formatDecimal(restaurant.averageRating, 1, 1)} : '-'">4.5</span>
        <small>(리뷰 <span th:text="${restaurant.reviewCount}">0</span>)</small>
      </span>
    </div>
    <div class="actions" th:if="${canManage}">
      <a class="btn btn-ghost btn-sm" th:href="@{/restaurants/{id}/edit(id=${restaurant.id})}">수정</a>
      <form class="inline" th:action="@{/restaurants/{id}/delete(id=${restaurant.id})}" method="post"
            onsubmit="return confirm('정말 삭제할까요? 달린 리뷰도 함께 삭제됩니다.')">
        <button class="btn btn-danger btn-sm" type="submit">삭제</button>
      </form>
    </div>
  </div>

  <div class="detail-layout">
    <section>
      <img class="detail-img" th:if="${restaurant.imageUrl != null}" th:src="${restaurant.imageUrl}" alt="">
      <div class="panel">
        <table class="info-table">
          <tr><th>주소</th><td th:text="${restaurant.address}">주소</td></tr>
          <tr th:if="${restaurant.phone != null}"><th>전화</th><td th:text="${restaurant.phone}">전화</td></tr>
          <tr th:if="${restaurant.openingHours != null}"><th>영업시간</th><td th:text="${restaurant.openingHours}">시간</td></tr>
          <tr th:if="${restaurant.representativeMenu != null}"><th>대표 메뉴</th><td th:text="${restaurant.representativeMenu}">메뉴</td></tr>
          <tr><th>등록자</th><td th:text="${restaurant.author.nickname}">작성자</td></tr>
        </table>
        <p class="pre" th:if="${restaurant.description != null}" th:text="${restaurant.description}" style="margin-bottom:0"></p>
      </div>
    </section>

    <section>
      <div id="map" th:if="${restaurant.hasCoordinates()}"></div>
      <div class="panel muted" th:unless="${restaurant.hasCoordinates()}">등록된 위치 좌표가 없어 지도를 표시할 수 없습니다.</div>
      <span hidden data-marker th:if="${restaurant.hasCoordinates()}"
            th:attr="data-id=${restaurant.id},data-name=${restaurant.name},data-lat=${restaurant.latitude},data-lng=${restaurant.longitude},data-url='/restaurants/' + ${restaurant.id},data-summary=${restaurant.address}"></span>
    </section>
  </div>

  <h2 id="reviews">리뷰 <span class="muted" th:text="'(' + ${restaurant.reviewCount} + ')'"></span></h2>

  <div class="panel review-form" th:if="${loginMember != null and restaurant.approved}">
    <form method="post"
          th:action="${myReview != null} ? @{/reviews/{rid}/edit(rid=${myReview.id})} : @{/restaurants/{id}/reviews(id=${restaurant.id})}">
      <strong th:text="${myReview != null} ? '내 리뷰 수정' : '리뷰 남기기'">리뷰 남기기</strong>
      <div>
        <div class="star-input">
          <th:block th:each="i : ${#numbers.sequence(5, 1, -1)}">
            <input type="radio" name="rating" th:id="'star' + ${i}" th:value="${i}"
                   th:checked="${reviewForm.rating != null and reviewForm.rating == i}">
            <label th:for="'star' + ${i}" th:title="${i} + '점'">★</label>
          </th:block>
        </div>
      </div>
      <textarea name="content" class="full" placeholder="맛, 분위기, 가격 등 솔직한 후기를 남겨 주세요. (5자 이상)"
                th:text="${reviewForm.content}"></textarea>
      <div class="actions" style="margin-top:10px">
        <button class="btn" type="submit" th:text="${myReview != null} ? '수정하기' : '등록하기'">등록하기</button>
      </div>
    </form>
  </div>
  <div class="panel muted" th:if="${loginMember == null and restaurant.approved}">
    리뷰를 작성하려면 <a th:href="@{/login}">로그인</a>해 주세요.
  </div>

  <p class="muted" th:if="${#lists.isEmpty(reviews)}">아직 리뷰가 없습니다.</p>
  <ul class="reviews" th:unless="${#lists.isEmpty(reviews)}">
    <li class="review" th:each="rv : ${reviews}">
      <div class="review-head">
        <strong th:text="${rv.member.nickname}">닉네임</strong>
        <span class="stars" th:text="${rv.stars}">★★★★★</span>
        <small class="muted" th:text="${#temporals.format(rv.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</small>
        <form class="inline" method="post" th:action="@{/reviews/{id}/delete(id=${rv.id})}"
              th:if="${loginMember != null and (loginMember.admin or loginMember.id == rv.member.id)}"
              onsubmit="return confirm('리뷰를 삭제할까요?')">
          <button class="btn btn-ghost btn-sm" type="submit">삭제</button>
        </form>
      </div>
      <p class="pre" th:text="${rv.content}">내용</p>
    </li>
  </ul>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>

<th:block th:if="${restaurant.hasCoordinates() and @mapProperties.enabled}">
  <script th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${@mapProperties.key}&amp;autoload=false|"></script>
</th:block>
<script th:src="@{/js/map.js}" th:if="${restaurant.hasCoordinates()}"></script>
</body>
</html>
