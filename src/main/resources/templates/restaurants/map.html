<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('맛집 지도')}"></head>
<body class="map-page">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
  <div class="detail-head">
    <h1>부산 맛집 지도</h1>
    <select id="category-filter" style="padding:8px 12px;border-radius:8px;border:1px solid var(--border)">
      <option value="">전체 분류</option>
      <option th:each="c : ${@enums.categories()}" th:value="${c}" th:text="${c.label}"></option>
    </select>
  </div>

  <div id="map"></div>

  <p class="muted" th:if="${#lists.isEmpty(restaurants)}">좌표가 등록된 맛집이 아직 없습니다.</p>
  <ul class="map-list">
    <li data-marker th:each="r : ${restaurants}"
        th:attr="data-id=${r.id},data-name=${r.name},data-lat=${r.latitude},data-lng=${r.longitude},data-category=${r.category.name()},data-url='/restaurants/' + ${r.id},data-summary=${r.category.label} + ' · ' + ${r.district.label}">
      <strong th:text="${r.name}">이름</strong>
      <div class="card-meta" th:text="${r.category.label} + ' · ' + ${r.district.label}">분류</div>
      <div class="rating">★ <span th:text="${r.reviewCount > 0} ? ${#numbers.formatDecimal(r.averageRating, 1, 1)} : '-'">-</span></div>
    </li>
  </ul>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>

<th:block th:if="${@mapProperties.enabled}">
  <script th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${@mapProperties.key}&amp;autoload=false|"></script>
</th:block>
<script th:src="@{/js/map.js}"></script>
</body>
</html>
