<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원 관리')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
  <h1>회원 관리</h1>
  <div class="table-wrap">
    <table class="list">
      <thead><tr><th>아이디</th><th>닉네임</th><th>이메일</th><th>권한</th><th>상태</th><th>가입일</th><th>관리</th></tr></thead>
      <tbody>
        <tr th:each="m : ${page.content}">
          <td th:text="${m.username}">id</td>
          <td th:text="${m.nickname}">닉네임</td>
          <td th:text="${m.email}">email</td>
          <td><span class="badge" th:classappend="${m.role.name()}" th:text="${m.role.name()}">USER</span></td>
          <td th:text="${m.enabled} ? '정상' : '정지'">정상</td>
          <td th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd')}">날짜</td>
          <td>
            <div class="actions" th:unless="${m.username == loginMember.username}">
              <form class="inline" method="post" th:action="@{/admin/members/{id}/toggle-enabled(id=${m.id})}"
                    onsubmit="return confirm('회원 상태를 변경할까요?')">
                <button class="btn btn-ghost btn-sm" type="submit" th:text="${m.enabled} ? '정지' : '정지 해제'">정지</button>
              </form>
              <form class="inline" method="post" th:action="@{/admin/members/{id}/toggle-role(id=${m.id})}"
                    onsubmit="return confirm('회원 권한을 변경할까요?')">
                <button class="btn btn-ghost btn-sm" type="submit" th:text="${m.admin} ? '관리자 해제' : '관리자 지정'">권한</button>
              </form>
            </div>
            <span class="muted" th:if="${m.username == loginMember.username}">(본인)</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav class="pagination" th:if="${page.totalPages > 1}">
    <a th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
       th:href="@{/admin/members(page=${i})}" th:text="${i + 1}"
       th:classappend="${i == page.number} ? 'active'">1</a>
  </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
